<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>改天盲盒 · 3D 场景草模</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;color:#402a22;background:radial-gradient(circle at 50% 12%,#fffaf0 0,#f4dfc9 47%,#dab89d 100%);overflow:hidden}.top{position:fixed;z-index:20;top:0;left:0;right:0;padding:24px 28px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.top h1{font-size:23px;margin:0 0 5px}.top p{margin:0;opacity:.65;font-size:14px}.pill{padding:8px 12px;border-radius:99px;background:#ffffff99;backdrop-filter:blur(16px);font-size:12px;letter-spacing:.04em}.scene{position:absolute;inset:0;display:grid;place-items:center;perspective:950px;touch-action:none;cursor:grab}.scene:active{cursor:grabbing}.world{position:relative;width:220px;height:180px;transform-style:preserve-3d;transform:rotateX(-14deg) rotateY(-28deg);will-change:transform}.shadow{position:absolute;left:50%;top:82%;width:280px;height:75px;background:#62371d38;border-radius:50%;filter:blur(16px);transform:translate3d(-50%,0,-110px) rotateX(90deg)}.body3d{position:absolute;left:10px;top:30px;width:200px;height:140px;transform-style:preserve-3d}.face{position:absolute;display:grid;place-items:center;backface-visibility:hidden}.front,.back{width:200px;height:140px}.left,.right{width:112px;height:140px;left:44px}.front{transform:translateZ(56px);background:linear-gradient(145deg,#c8754e,#a54f35);border-radius:8px 8px 17px 17px}.back{transform:rotateY(180deg) translateZ(56px);background:#8e432e}.left{transform:rotateY(-90deg) translateZ(100px);background:#95452f}.right{transform:rotateY(90deg) translateZ(100px);background:#b55c3e}.bottom{width:200px;height:112px;top:14px;transform:rotateX(-90deg) translateZ(70px);background:#713420}.front:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 4px 4px 0 #ffffff20,inset -6px -8px 16px #632a2228}.eyes{position:absolute;top:49px;left:0;right:0;display:flex;gap:38px;justify-content:center;transform:translateZ(58px)}.eye{width:14px;height:20px;border-radius:50%;background:#43291f;box-shadow:inset 0 -3px #160b08}.eye:after{content:"";display:block;width:4px;height:5px;border-radius:50%;margin:3px;background:white}.mouth{position:absolute;width:25px;height:13px;left:88px;top:82px;border-bottom:4px solid #43291f;border-radius:0 0 30px 30px;transform:translateZ(58px)}.cheek{position:absolute;width:23px;height:10px;border-radius:50%;top:79px;background:#f3957c88;transform:translateZ(58px)}.c1{left:43px}.c2{right:43px}.sticker{position:absolute;left:22px;bottom:18px;color:#f6d46b;font-size:28px;transform:translateZ(59px) rotate(-14deg)}.lid3d{position:absolute;left:2px;top:11px;width:216px;height:34px;transform-style:preserve-3d;transform-origin:50% 50% -48px;transition:transform .7s cubic-bezier(.2,.8,.2,1)}.open .lid3d{transform:translateY(-24px) rotateX(-33deg)}.lidtop{position:absolute;width:216px;height:112px;transform:rotateX(90deg) translateZ(56px);background:linear-gradient(165deg,#dd8b61,#ae5438);border-radius:15px}.lidfront{position:absolute;width:216px;height:34px;transform:translateZ(56px);background:linear-gradient(#d87d55,#ad4e34);border-radius:12px 12px 7px 7px;box-shadow:inset 3px 3px #ffffff25}.lidside{position:absolute;width:112px;height:34px;left:52px;background:#98432e}.lidleft{transform:rotateY(-90deg) translateZ(108px)}.lidright{transform:rotateY(90deg) translateZ(108px)}.slot{position:absolute;width:75px;height:12px;left:70px;top:37px;border-radius:20px;background:#46261988;transform:rotateX(90deg) translateZ(59px)}.paper{position:absolute;left:83px;top:18px;width:55px;height:72px;border-radius:7px;background:linear-gradient(150deg,#fff8d3,#f5dfa1);box-shadow:0 10px 16px #57322030;transform:translate3d(0,-70px,0) rotateX(-8deg) rotateZ(-4deg);opacity:0;transition:.65s cubic-bezier(.1,.9,.2,1)}.open .paper{opacity:1;transform:translate3d(0,-112px,2px) rotateX(-8deg) rotateZ(-4deg)}.paper:after{content:"今天，去做一件小事";position:absolute;inset:12px 7px;font-size:7px;line-height:1.45;color:#795b42}.spark{position:absolute;color:#ffe280;font-size:25px;opacity:0;filter:drop-shadow(0 0 8px white)}.open .spark{animation:spark 1.3s .3s ease-out}.s1{left:22px;top:-50px}.s2{right:5px;top:-20px;animation-delay:.45s!important}.s3{right:52px;top:-82px;animation-delay:.6s!important}@keyframes spark{0%{opacity:0;transform:scale(.2)}35%{opacity:1}100%{opacity:0;transform:translateY(-34px) scale(1.3)}}.controls{position:fixed;z-index:20;left:50%;bottom:25px;transform:translateX(-50%);display:flex;gap:10px;padding:9px;border-radius:20px;background:#fff9;box-shadow:0 12px 35px #5d311c24;backdrop-filter:blur(18px)}button{border:0;border-radius:14px;padding:12px 17px;font:600 14px inherit;color:#593224;background:#fff;box-shadow:0 1px 2px #0001;cursor:pointer}button.primary{color:white;background:#a94f31}button:active{transform:scale(.97)}.tip{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);font-size:13px;opacity:.58;white-space:nowrap}.badge{position:absolute;right:28px;top:88px;width:270px;padding:16px;border-radius:18px;background:#fff8;backdrop-filter:blur(16px);font-size:13px;line-height:1.55;box-shadow:0 12px 30px #633b2620}.badge b{display:block;margin-bottom:4px}@media(max-width:760px){.world{transform:scale(.82) rotateX(-14deg) rotateY(-28deg)}.badge{top:auto;bottom:95px;right:16px;left:16px;width:auto}.tip{display:none}.top{padding:18px}.controls{bottom:18px}}
</style>
</head>
<body>
<header class="top"><div><h1>改天盲盒 · 3D 场景草模</h1><p>这是可实时旋转的空间对象，不是预渲染图片</p></div><span class="pill">DRAG TO ROTATE</span></header>
<main class="scene" id="scene">
  <div class="world" id="world">
    <div class="shadow"></div>
    <div class="body3d">
      <div class="face front"></div><div class="face back"></div><div class="face left"></div><div class="face right"></div><div class="face bottom"></div>
      <div class="eyes"><i class="eye"></i><i class="eye"></i></div><div class="mouth"></div><i class="cheek c1"></i><i class="cheek c2"></i><span class="sticker">★</span>
    </div>
    <div class="lid3d"><div class="lidtop"></div><div class="lidfront"></div><div class="lidside lidleft"></div><div class="lidside lidright"></div><div class="slot"></div></div>
    <div class="paper"></div><span class="spark s1">✦</span><span class="spark s2">✧</span><span class="spark s3">✦</span>
  </div>
</main>
<aside class="badge"><b>原生 iOS 对应实现</b>RealityKit 渲染 USDZ 箱体、灯光和阴影；SwiftUI 负责标题、按钮和无障碍替代。拖拽改变 Entity 的旋转，开盖与纸条弹出使用命名动画。</aside>
<div class="tip">左右/上下拖动箱子；点按钮查看开盖反馈</div>
<nav class="controls"><button id="reset">回正</button><button class="primary" id="toggle">打开箱子</button><button id="tap">轻敲一下</button></nav>
<script>
const scene=document.querySelector('#scene'),world=document.querySelector('#world'),toggle=document.querySelector('#toggle');let x=-14,y=-28,drag=false,px=0,py=0,opened=false;
function render(){world.style.transform=`rotateX(${x}deg) rotateY(${y}deg)`}
scene.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;scene.setPointerCapture(e.pointerId)});
scene.addEventListener('pointermove',e=>{if(!drag)return;y+=(e.clientX-px)*.38;x=Math.max(-42,Math.min(28,x-(e.clientY-py)*.28));px=e.clientX;py=e.clientY;render()});
scene.addEventListener('pointerup',()=>drag=false);scene.addEventListener('pointercancel',()=>drag=false);
toggle.onclick=()=>{opened=!opened;world.classList.toggle('open',opened);toggle.textContent=opened?'合上箱子':'打开箱子'};
document.querySelector('#reset').onclick=()=>{x=-14;y=-28;render()};
document.querySelector('#tap').onclick=()=>{world.animate([{transform:`rotateX(${x}deg) rotateY(${y}deg) translateY(0)`},{transform:`rotateX(${x-3}deg) rotateY(${y+3}deg) translateY(-9px)`},{transform:`rotateX(${x}deg) rotateY(${y}deg) translateY(0)`}],{duration:420,easing:'cubic-bezier(.2,.9,.3,1)'})};
</script>
</body></html>
