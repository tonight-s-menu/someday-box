name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  domain:
    name: Domain tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic domain tests
        run: make test

  ios:
    name: iOS build and tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected Xcode
        run: xcodebuild -version
      - name: Build and test iOS scheme
        run: xcodebuild test -project SomedayBox.xcodeproj -scheme SomedayBox -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
